<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/nextlive_site_full/panel/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Panel de Control</title>
  <style>
    body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    header { background-color: #111; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    header h1 { color: gold; margin: 0; }
    header img { height: 40px; }
    nav { display: flex; justify-content: center; gap: 2rem; padding: 1rem; background-color: #111; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    main { padding: 2rem; }
    h2 { color: gold; text-align: center; }
    .vps-box { background-color: #111; padding: 1rem; margin: 1rem auto; width: 90%; max-width: 500px; border-radius: 10px; }
    input, select { width: 100%; padding: 0.5rem; margin: 0.5rem 0; }
    button { width: 100%; padding: 0.7rem; background-color: gold; color: black; font-weight: bold; border: none; border-radius: 6px; }
    .progress { width: 100%; background: #333; height: 20px; border-radius: 10px; margin-top: 0.5rem; }
    .progress-bar { height: 100%; width: 0%; background: gold; border-radius: 10px; transition: width 0.3s ease; }
  </style>
</head>
<body>
  <header>
    <h1>NextLive</h1>
    <img src="../logo.png" alt="Logo" />
  </header>
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="../optimizacion/index.html">Optimización</a>
    <a href="index.html">Panel de Control</a>
  </nav>
  <main>
    <h2>Panel de Control - VPS</h2>
    <div id="panel-container"></div>
  </main>
  <script>
    const panel = document.getElementById("panel-container");
    for (let i = 1; i <= 20; i++) {
      panel.innerHTML += `
        <div class="vps-box">
          <h3>VPS ${i}</h3>
          <select>
            <option selected disabled>Selecciona un video optimizado</option>
            <option>video_opt_${i}_a.mp4</option>
            <option>video_opt_${i}_b.mp4</option>
          </select>
          <input type="text" placeholder="Clave de transmisión" />
          <button onclick="startStream(${i})">Start</button>
          <div class="progress"><div class="progress-bar" id="bar${i}"></div></div>
        </div>
      `;
    }

    function startStream(id) {
      const bar = document.getElementById('bar' + id);
      let width = 0;
      const interval = setInterval(() => {
        if (width >= 100) {
          clearInterval(interval);
        } else {
          width++;
          bar.style.width = width + "%";
        }
      }, 100);
    }
  </script>
</body>
</html>
