<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Optimización de Videos</title>
  <style>
    body { background-color: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
    header, nav { background-color: #111; }
    header { padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    nav { display: flex; justify-content: center; gap: 2rem; padding: 1rem; }
    nav a { color: white; text-decoration: none; font-weight: bold; }
    header h1 { color: gold; margin: 0; }
    header img { height: 40px; }
    main { text-align: center; padding: 2rem; }
    input[type="file"] { background: #222; color: #fff; border: 1px solid #444; padding: 1rem; }
    button {
      background-color: gold; border: none; padding: 0.7rem 2rem; color: black;
      font-weight: bold; cursor: pointer; margin-top: 1rem;
    }
    .optimized-list {
      margin-top: 2rem;
      background: #111;
      padding: 1rem;
      border-radius: 10px;
    }
    .optimized-list h3 {
      color: gold;
    }
    .optimized-list ul {
      list-style: none;
      padding: 0;
    }
    .optimized-list li {
      padding: 5px 0;
      color: lime;
    }
  </style>
</head>
<body>
  <header>
    <h1>NextLive</h1>
    <img src="../logo.png" alt="Logo" />
  </header>
  <nav>
    <a href="../index.html">Inicio</a>
    <a href="index.html">Optimización</a>
    <a href="../panel/index.html">Panel de Control</a>
  </nav>
  <main>
    <h2>Optimización de Videos</h2>
    <input type="file" multiple /><br>
    <button>Subir y Optimizar</button>
    <div class="optimized-list">
      <h3>Videos ya optimizados:</h3>
      <ul>
        <li>video_opt_1.mp4</li>
        <li>video_opt_2.mp4</li>
      </ul>
    </div>
  </main>
</body>
</html>
