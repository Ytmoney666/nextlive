<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextLive - Plataforma</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #111;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      color: gold;
      margin: 0;
    }
    header img {
      height: 40px;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
      background-color: #111;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      padding: 2rem;
    }
    .section {
      margin-bottom: 3rem;
    }
    .vps-list, .video-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .card {
      background-color: #1a1a1a;
      padding: 1rem;
      border: 1px solid #333;
      border-radius: 10px;
    }
    .card h3 {
      color: gold;
    }
    input[type="file"], input[type="text"] {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.5rem;
      background-color: #111;
      border: 1px solid #444;
      color: #fff;
    }
    button {
      padding: 0.5rem 1rem;
      background-color: gold;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: #333;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 1rem;
    }
    .progress {
      height: 100%;
      background-color: red;
      width: 0%;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <header>
    <h1>NextLive</h1>
    <img src="logo.png" alt="NextLive Logo">
  </header>
  <nav>
    <a href="#">Inicio</a>
    <a href="#optimizar">Optimización de Videos</a>
    <a href="#panel">Panel de Control</a>
  </nav>

  <main>
    <section id="optimizar" class="section">
      <h2>Optimización de Videos</h2>
      <input type="file" multiple accept="video/mp4">
      <button>Subir y Optimizar</button>
    </section>

    <section id="panel" class="section">
      <h2>Panel de Control - VPS</h2>
      <div class="vps-list">
        <!-- VPS 1 al 20 -->
        <div class="card">
          <h3>VPS 1</h3>
          <div class="video-list">
            <p>Video_Optimizado_1.mp4</p>
            <input type="text" placeholder="Clave de transmisión">
            <button>Start</button>
            <div class="progress-bar"><div class="progress" style="width: 10%;"></div></div>
          </div>
        </div>
        <div class="card">
          <h3>VPS 2</h3>
          <div class="video-list">
            <p>Video_Optimizado_2.mp4</p>
            <input type="text" placeholder="Clave de transmisión">
            <button>Start</button>
            <div class="progress-bar"><div class="progress" style="width: 25%;"></div></div>
          </div>
        </div>
        <!-- VPS 3 al 20 -->
        <!-- Puedes duplicar este bloque y actualizar el número de VPS -->
        <!-- Aquí un ejemplo para VPS 3 al 20 -->
        <!-- Se repite el mismo patrón -->
        <!-- INICIO BLOQUE DINÁMICO -->
        <!-- AUTOGENERADO PARA VPS 3 AL 20 -->
        
        <!-- VPS 3 -->
        <div class="card">
          <h3>VPS 3</h3>
          <div class="video-list">
            <p>Video_Optimizado_3.mp4</p>
            <input type="text" placeholder="Clave de transmisión">
            <button>Start</button>
            <div class="progress-bar"><div class="progress" style="width: 0%;"></div></div>
          </div>
        </div>
        <!-- ... REPETIR HASTA VPS 20 -->
        <div class="card">
          <h3>VPS 4</h3>
          <div class="video-list">
            <p>Video_Optimizado_4.mp4</p>
            <input type="text" placeholder="Clave de transmisión">
            <button>Start</button>
            <div class="progress-bar"><div class="progress" style="width: 0%;"></div></div>
          </div>
        </div>
        <!-- ... -->
        <div class="card">
          <h3>VPS 20</h3>
          <div class="video-list">
            <p>Video_Optimizado_20.mp4</p>
            <input type="text" placeholder="Clave de transmisión">
            <button>Start</button>
            <div class="progress-bar"><div class="progress" style="width: 0%;"></div></div>
          </div>
        </div>

        <!-- FIN BLOQUE DINÁMICO -->
      </div>
    </section>
  </main>
</body>
</html>
